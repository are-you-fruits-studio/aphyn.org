[package]
name = "aphyn-site"
version = "0.1.0"
edition = "2021"
description = "aphyn.org — the website of the Aphyn game engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/are-you-fruits-studio/aphyn.org"
publish = false

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Location",
    "Navigator",
    "Response",
    "Storage",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
