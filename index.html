  <!-- Before anything paints: pick the theme (saved choice, else the system
       setting, else dark), drop a trailing slash GitHub Pages adds to
       language folders (/uk/ → /uk), and set `lang` from the URL. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('aphyn-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      var path = location.pathname;
      if (path.length > 1 && path.charAt(path.length - 1) === '/') {
        path = path.slice(0, -1);
        history.replaceState(null, '', path + location.search + location.hash);
      }
      var first = path.split('/')[1];
      if (first && /^[a-z]{2,3}(-[A-Za-z0-9]+)?$/.test(first)) document.documentElement.lang = first;
    })();
  </script>
