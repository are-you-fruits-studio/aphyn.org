# Keeps the pinned GitHub Actions and the Rust dependencies current.
# Commit messages follow Conventional Commits (see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # yew-router is built against one yew version: bump them together,
      # or each PR alone pulls two yews and fails to compile.
      yew:
        patterns: ["yew", "yew-router"]
      cargo:
        update-types: [minor, patch]
