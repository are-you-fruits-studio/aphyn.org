<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- The Aphyn favicon from the design system: the berry mark redrawn on a
       16px grid with heavier calyx arms. Bilberry on light tabs, the lighter
       Bilberry tint on dark ones. -->
  <style>circle{fill:#3B3486}@media (prefers-color-scheme:dark){circle{fill:#7870C4}}</style>
  <defs>
    <mask id="calyx">
      <rect width="16" height="16" fill="#fff"/>
      <path d="M10.4 5.4 10.82 3.04M10.4 5.4 12.24 6.94M10.4 5.4 8.14 6.22" stroke="#000" stroke-width="1.9" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>
  <circle cx="8" cy="8" r="7.5" mask="url(#calyx)"/>
</svg>
